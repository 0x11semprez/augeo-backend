services:
  devis-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devis-api:latest
    container_name: devis-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
